name: Update stream links

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch links from YouTube
        run: python fetch_links.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Save changes
        run: |
          git config user.name "links-bot"
          git config user.email "links-bot@users.noreply.github.com"
          git add links.json
          git diff --cached --quiet || (git commit -m "Update stream links" && git push)
